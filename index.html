<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Taman Kitani Quiz</title>
<style>
/* Layout: a Kodular-style phone app (app bar, scrolling screen, chunky buttons) centred in a phone frame on wide screens, full-bleed on phones. */
:root {
  --bg: #899F6DFE;
  --on-bg: #ffffff;
  --btn: #324B3CFE;
  --btn-deep: #1e2f25;
  --btn-ink: #e2e2e2;
  --sky: #c9e7e0;
  --cream: #f6f3d9;
  --wood: #8b5e3c;
  --wood-deep: #5e3f26;
  --frame: #b7d8cf;
  --surface: #fffdf2;
  --ink: #111111;
  --ink-soft: #5c5c5c;
  --primary: #6aa33a;
  --primary-deep: #467a24;
  --on-primary: #111111;
  --sun: #fdd459;
  --sun-ink: #111111;
  --trunk: #d9a374;
  --line: #b9d5c8;
  --ok: #86c24a;
  --ok-bg: #e6f2d6;
  --bad: #e0806a;
  --bad-bg: #fbe3da;
  --shadow: rgba(70, 90, 60, .30);
  --display: system-ui, sans-serif;
  --body: system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--frame);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  display: flex;
  justify-content: center;
  align-items: stretch;
}
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.app {
  width: 100%;
  max-width: 440px;
  height: 100%;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}
@media (min-width: 600px) {
  body { padding: 20px 16px; }
  .app {
    height: min(100%, 820px);
    align-self: center;
    box-shadow: 0 24px 60px var(--shadow);
  }
}

/* Progress strip */
.progress {
  flex: none;
  height: 10px;
  background: var(--line);
  z-index: 2;
}
.progress-fill {
  height: 100%;
  width: 0;
  background: var(--primary);
  transition: width .35s ease;
}

/* Screens */
.screens { flex: 1; min-height: 0; position: relative; }
.screen {
  position: absolute; inset: 0;
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Home */
.home { align-items: center; text-align: center; justify-content: center; }
.hero-logo {
  width: min(62vw, 220px);
  aspect-ratio: 1;
}
.home h1 { font-size: 1.9rem; line-height: 1.1; color: var(--on-bg); text-shadow: 0 1px 3px rgba(0,0,0,.35); }

/* Buttons */
.btn {
  border: 0;
  background: var(--btn);
  color: var(--btn-ink);
  font-family: var(--display);
  font-weight: 600;
  font-size: 1.1rem;
  letter-spacing: .02em;
  padding: 14px 20px;
  box-shadow: 0 5px 0 var(--btn-deep);
  cursor: pointer;
  width: 100%;
  transition: transform .08s ease, box-shadow .08s ease;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--btn-deep); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; flex-direction: column; gap: 14px; width: 100%; }

/* Question */
.q-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 800; font-size: .85rem; color: var(--on-bg); text-shadow: 0 1px 3px rgba(0,0,0,.35);
  text-transform: uppercase; letter-spacing: .08em;
}
.score-pill {
  background: var(--sun); color: var(--sun-ink); text-shadow: none; padding: 2px 12px;
  font-variant-numeric: tabular-nums;
}
.card {
  background: var(--surface);
  padding: 18px;
}
.question { font-size: 1.4rem; line-height: 1.2; }
.options { display: flex; flex-direction: column; gap: 12px; }
.opt {
  display: flex; align-items: center; gap: 12px;
  text-align: left;
  width: 100%;
  background: var(--surface);
  border: 0;
  padding: 12px 14px;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  transition: transform .08s ease, background .15s ease;
}
.opt:not([disabled]):hover { background: #ffffff; }
.opt:not([disabled]):active { transform: translateY(3px); }
.opt .badge {
  flex: none;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  background: var(--bg);
  font-family: var(--display);
  font-weight: 600;
  color: var(--ink);
}
.opt .txt { flex: 1; min-width: 0; }
.opt[disabled] { cursor: default; }
.opt.correct { background: var(--ok-bg); }
.opt.wrong { background: var(--bad-bg); }
.opt.correct .badge { background: var(--ok); color: var(--ink); }
.opt.wrong .badge { background: var(--bad); color: var(--ink); }
.opt.dim { opacity: .55; }
.feedback { min-height: 1.5em; font-weight: 800; color: var(--on-bg); text-shadow: 0 1px 3px rgba(0,0,0,.35); }
.feedback.ok { color: var(--on-bg); }
.feedback.bad { color: var(--on-bg); }
.spacer { flex: 1; }

/* Result */
.result { align-items: stretch; }
.score-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.ring { width: 150px; height: 150px; }
.ring .track { stroke: var(--line); }
.ring .bar { stroke: var(--primary); transition: stroke-dashoffset .8s ease; }
.ring text { font-family: var(--display); fill: var(--on-bg); font-weight: 700; }
.result h2 { font-size: 1.6rem; color: var(--on-bg); text-shadow: 0 1px 3px rgba(0,0,0,.35); }
.result .msg { color: var(--on-bg); text-shadow: 0 1px 3px rgba(0,0,0,.35); }
.review { display: flex; flex-direction: column; gap: 10px; padding: 0; list-style: none; margin: 0; }
.review li {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--surface);
  padding: 10px 12px;
}
.review .mark {
  flex: none; width: 24px; height: 24px;
  display: grid; place-items: center;
  font-weight: 800; font-size: .85rem;
  color: var(--ink);
}
.review .mark.ok { background: var(--ok); }
.review .mark.bad { background: var(--bad); }
.review .rq { font-weight: 800; font-size: .95rem; }
.review .ra { color: var(--ink-soft); font-size: .88rem; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>

      <div>
        <h1>Mahkota Jubli Emas Park Quiz</h1>
      </div>
      <div class="btn-row">
        <button class="btn sun" id="startBtn">START QUIZ</button>
      </div>
    </section>

    <!-- Screen 2: Question -->
    <section class="screen" id="screenQuiz" hidden>
      <div class="q-meta">
        <span id="qCount">Question 1 of 5</span>
        <span class="score-pill" id="scorePill">Score 0</span>
      </div>
      <div class="card"><h2 class="question" id="qText"></h2></div>
      <div class="options" id="options"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <div class="spacer"></div>
      <button class="btn" id="nextBtn" disabled>NEXT</button>
    </section>

    <!-- Screen 3: Result -->
    <section class="screen result" id="screenResult" hidden>
      <div class="score-wrap">
        <svg class="ring" viewBox="0 0 120 120" role="img" aria-label="Final score">
          <circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="12"/>
          <circle class="bar" id="ringBar" cx="60" cy="60" r="52" fill="none" stroke-width="12" transform="rotate(-90 60 60)" stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
          <text id="ringText" x="60" y="70" text-anchor="middle" font-size="30">0/5</text>
        </svg>
        <h2 id="resTitle"></h2>
        <p class="msg" id="resMsg"></p>
      </div>
      <ul class="review" id="review"></ul>
      <div class="btn-row">
        <button class="btn sun" id="againBtn">PLAY AGAIN</button>
        <button class="btn ghost" id="homeBtn">HOME</button>
      </div>
    </section>
  </main>

</div>

<script>
(function () {
  var QUESTIONS = [
    { q: "What is Mahkota Jubli Emas also called?",
      a: ["Golden Jubilee Crown Park", "Silver River Park", "Diamond Garden"] },
    { q: "In which city is the park located?",
      a: ["Bandar Seri Begawan", "Kuala Belait", "Tutong"] },
    { q: "Which river is next to the park?",
      a: ["Kedayan River", "Amazon River", "Nile River"] },
    { q: "Why was the park built?",
      a: ["To celebrate Sultan’s Golden Jubilee", "To host football matches", "To build a shopping mall"] },
    { q: "When was the park opened?",
      a: ["22 October 2017", "1 January 2015", "31 December 2020"] }
  ];
  var LETTERS = ["A", "B", "C"];
  var $ = function (id) { return document.getElementById(id); };
  var screens = { home: $("screenHome"), quiz: $("screenQuiz"), result: $("screenResult") };
  var state = { i: 0, score: 0, locked: false, picks: [], order: [] };

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function show(name) {
    Object.keys(screens).forEach(function (k) { screens[k].hidden = k !== name; });
    $("progress").hidden = name !== "quiz";
    screens[name].scrollTop = 0;
  }

  function start() {
    state.i = 0; state.score = 0; state.picks = [];
    state.order = QUESTIONS.map(function (q) { return shuffle(q.a); });
    show("quiz");
    render();
  }

  function render() {
    var q = QUESTIONS[state.i];
    state.locked = false;
    $("qCount").textContent = "Question " + (state.i + 1) + " of " + QUESTIONS.length;
    $("scorePill").textContent = "Score " + state.score;
    $("qText").textContent = q.q;
    $("progressFill").style.width = (state.i / QUESTIONS.length * 100) + "%";
    $("feedback").textContent = "";
    $("feedback").className = "feedback";
    $("nextBtn").disabled = true;
    $("nextBtn").textContent = state.i === QUESTIONS.length - 1 ? "SEE RESULT" : "NEXT";
    var box = $("options");
    box.innerHTML = "";
    state.order[state.i].forEach(function (text, n) {
      var b = document.createElement("button");
      b.className = "opt";
      b.type = "button";
      b.innerHTML = '<span class="badge"></span><span class="txt"></span>';
      b.querySelector(".badge").textContent = LETTERS[n];
      b.querySelector(".txt").textContent = text;
      b.addEventListener("click", function () { pick(text, b); });
      box.appendChild(b);
    });
  }

  function pick(text, btn) {
    if (state.locked) return;
    state.locked = true;
    var q = QUESTIONS[state.i];
    var right = text === q.a[0];
    state.picks[state.i] = text;
    if (right) state.score++;
    $("scorePill").textContent = "Score " + state.score;
    Array.prototype.forEach.call($("options").children, function (el) {
      var t = el.querySelector(".txt").textContent;
      el.disabled = true;
      if (t === q.a[0]) el.classList.add("correct");
      else if (el === btn) el.classList.add("wrong");
      else el.classList.add("dim");
      if (t === q.a[0]) el.querySelector(".badge").textContent = "✓";
      else if (el === btn) el.querySelector(".badge").textContent = "✕";
    });
    var fb = $("feedback");
    fb.textContent = right ? "Correct!" : "Not quite. The answer is " + q.a[0] + ".";
    fb.className = "feedback " + (right ? "ok" : "bad");
    $("nextBtn").disabled = false;
    $("nextBtn").focus({ preventScroll: true });
  }

  function next() {
    if (state.i < QUESTIONS.length - 1) { state.i++; render(); }
    else finish();
  }

  function finish() {
    var total = QUESTIONS.length, s = state.score;
    $("progressFill").style.width = "100%";
    show("result");
    $("ringText").textContent = s + "/" + total;
    var title, msg;
    if (s === total) { title = "Perfect score!"; msg = "You know Mahkota Jubli Emas Park inside out."; }
    else if (s >= 3) { title = "Great job!"; msg = "Almost there. One more round for a perfect score?"; }
    else { title = "Good try!"; msg = "Play again and see how many you can get."; }
    $("resTitle").textContent = title;
    $("resMsg").textContent = msg;
    var circ = 2 * Math.PI * 52;
    var bar = $("ringBar");
    bar.style.strokeDashoffset = circ;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { bar.style.strokeDashoffset = circ * (1 - s / total); });
    });
    var ul = $("review");
    ul.innerHTML = "";
    QUESTIONS.forEach(function (q, n) {
      var ok = state.picks[n] === q.a[0];
      var li = document.createElement("li");
      li.innerHTML = '<span class="mark ' + (ok ? "ok" : "bad") + '"></span><div><div class="rq"></div><div class="ra"></div></div>';
      li.querySelector(".mark").textContent = ok ? "✓" : "✕";
      li.querySelector(".rq").textContent = q.q;
      li.querySelector(".ra").textContent = ok ? q.a[0] : "You chose " + state.picks[n] + ". Answer: " + q.a[0];
      ul.appendChild(li);
    });
  }

  $("startBtn").addEventListener("click", start);
  $("nextBtn").addEventListener("click", next);
  $("againBtn").addEventListener("click", start);
  $("homeBtn").addEventListener("click", function () { show("home"); });
  show("home");
})();
</script>
